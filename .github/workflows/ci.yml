name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: newsfeed_test
          POSTGRES_USER: newsfeed
          POSTGRES_PASSWORD: newsfeed_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U newsfeed -d newsfeed_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__Database: Host=localhost;Port=5432;Database=newsfeed_test;Username=newsfeed;Password=newsfeed_test_password
      Cors__AllowedOrigins__0: http://localhost:8081
      ASPNETCORE_ENVIRONMENT: Development
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore TazaKhabar.sln

      - name: Format check
        run: dotnet format TazaKhabar.sln --verify-no-changes --verbosity diagnostic

      - name: Build
        run: dotnet build TazaKhabar.sln -c Release --no-restore

      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 8.*

      - name: Generate migration SQL for review
        run: |
          mkdir -p artifacts
          dotnet ef migrations script \
            --project apps/api/TazaKhabar.Api.csproj \
            --idempotent \
            --output artifacts/newsfeed-migrations.sql

      - name: Upload migration SQL artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-migration-sql
          path: artifacts/newsfeed-migrations.sql

      - name: Check OpenAPI snapshot is current
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://127.0.0.1:8080
          ConnectionStrings__Database: Host=localhost;Port=5432;Database=newsfeed_test;Username=newsfeed;Password=newsfeed_test_password
          Cors__AllowedOrigins__0: http://localhost:8081
          Admin__Password: ci-admin-password
          Admin__JwtSigningKey: ci-admin-jwt-signing-key-min-32-chars
        run: |
          dotnet run --project apps/api/TazaKhabar.Api.csproj -c Release --no-build > api-openapi.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/openapi/v1.json -o /tmp/openapi.json; then
              break
            fi
            sleep 1
          done
          test -s /tmp/openapi.json
          diff -u packages/shared-types/openapi/openapi.json /tmp/openapi.json

      - name: Test
        run: dotnet test TazaKhabar.sln -c Release --no-build --verbosity normal

  frontend:
    name: Expo app lint, test, web export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm lint:app

      - name: Unit / component tests
        run: pnpm test:app -- --runInBand

      - name: Export web (Cloudflare Pages artifact)
        run: pnpm build:web
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.example.com
          EXPO_PUBLIC_APP_ENV: ci
          EXPO_PUBLIC_SUPPORT_EMAIL: support@example.com

      - name: Build admin (Cloudflare Pages artifact)
        run: pnpm build:admin
        env:
          VITE_API_BASE_URL: https://api.example.com
