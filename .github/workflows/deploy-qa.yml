name: Deploy QA

on:
  push:
    branches: [qa]
  workflow_dispatch:

concurrency:
  group: deploy-qa
  cancel-in-progress: false

jobs:
  deploy-reader:
    name: Deploy reader QA to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Export web
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_APP_ENV: qa
          EXPO_PUBLIC_SITE_URL: ${{ vars.EXPO_PUBLIC_SITE_URL || 'https://tazakhabar-site.pages.dev' }}
          EXPO_PUBLIC_WEB_PUSH_PUBLIC_KEY: ${{ vars.EXPO_PUBLIC_WEB_PUSH_PUBLIC_KEY }}
        run: pnpm build:web
      - name: Publish QA reader
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CLOUDFLARE_PAGES_QA_PROJECT_NAME || 'newsfeed-web-qa' }}
          directory: apps/app/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "3"
