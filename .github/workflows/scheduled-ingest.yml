name: Scheduled Ingest

on:
  schedule:
    # Every 15 minutes — primary scheduler on Render free tier (no cron jobs).
    # Also wakes the free web service so in-process ScheduledIngestHostedService can run.
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-ingest
  cancel-in-progress: false

jobs:
  rss-batches:
    name: RSS ingest batches
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Trigger RSS ingest
        env:
          INGEST_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
          RSS_INGEST_SECRET: ${{ secrets.RssIngest__Secret }}
        run: |
          set -euo pipefail

          if [ -z "${INGEST_URL:-}" ]; then
            echo "::error::Set repository or environment variable EXPO_PUBLIC_API_BASE_URL."
            exit 1
          fi

          if [ -z "${RSS_INGEST_SECRET:-}" ]; then
            echo "::error::Set repository or environment secret RssIngest__Secret."
            exit 1
          fi

          echo "Waking API..."
          curl --fail-with-body --silent --show-error --max-time 120 \
            "${INGEST_URL%/}/healthz" >/dev/null

          failures=0
          for batch in 1 2; do
            echo "RSS batch ${batch}/2"
            ok=0
            for attempt in 1 2; do
              if curl --fail-with-body --silent --show-error \
                --request POST \
                --header "X-Ingest-Key: ${RSS_INGEST_SECRET}" \
                --header "Accept: application/json" \
                --max-time 480 \
                "${INGEST_URL%/}/api/ingest/rss?maxSources=25"; then
                ok=1
                break
              fi
              echo "::warning::RSS batch ${batch} attempt ${attempt} failed; retrying..."
              sleep 15
            done
            if [ "$ok" -ne 1 ]; then
              echo "::warning::RSS batch ${batch} failed after retries"
              failures=$((failures + 1))
            fi
          done

          if [ "$failures" -eq 2 ]; then
            echo "::error::All RSS ingest batches failed."
            exit 1
          fi

  scrape-batch:
    name: Scrape ingest batch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: rss-batches
    steps:
      - name: Trigger scrape ingest
        env:
          INGEST_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
          RSS_INGEST_SECRET: ${{ secrets.RssIngest__Secret }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error --max-time 120 \
            "${INGEST_URL%/}/healthz" >/dev/null || true

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "X-Ingest-Key: ${RSS_INGEST_SECRET}" \
            --header "Accept: application/json" \
            --max-time 300 \
            "${INGEST_URL%/}/api/ingest/scrape?useRewrite=false"
