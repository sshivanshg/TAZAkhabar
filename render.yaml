# Render Blueprint — TazaKhabar API (ADR-004)
# Secrets (ConnectionStrings__Database, Cors origins, Admin, ingest) are set in the Render dashboard (sync: false).
#
# Free-tier note: Render cron jobs require a paid plan. Scheduled ingest and article
# purge run via GitHub Actions (.github/workflows/scheduled-ingest.yml and
# purge-old-articles.yml). The API web service also runs ScheduledIngestHostedService
# while the instance is awake (IngestSchedule__Enabled=true).

services:
  - type: web
    name: tazakhabar-api
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile.api
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:8080
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: "false"
      - key: ConnectionStrings__Database
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Cors__AllowedOrigins__1
        sync: false
      - key: RateLimiting__PermitLimit
        value: "60"
      - key: RateLimiting__WindowSeconds
        value: "60"
      - key: RssIngest__Secret
        sync: false
      - key: Admin__Password
        sync: false
      - key: Admin__JwtSigningKey
        sync: false
      - key: ArticleIntelligence__ApiKey
        sync: false
      - key: ArticleIntelligence__BaseUrl
        value: "[REDACTED]"
      - key: ArticleIntelligence__Model
        value: "[REDACTED]"
      - key: OpenAiRewrite__Enabled
        value: "true"
      - key: OpenAiRewrite__ApiKey
        sync: false
      - key: OpenAiRewrite__BaseUrl
        value: "https://api.openai.com/v1"
      - key: OpenAiRewrite__Model
        value: "gpt-4o-mini"
      - key: Upload__RootPath
        sync: false
      - key: ArticleRetention__Days
        value: "7"
      - key: IngestHealth__MaxSilenceMinutes
        value: "180"
      - key: IngestHealth__AlertWebhookUrl
        sync: false
      - key: IngestSchedule__Enabled
        value: "true"
      - key: IngestSchedule__RssIntervalMinutes
        value: "15"
      - key: IngestSchedule__RssMaxSourcesPerRun
        value: "30"
      - key: IngestSchedule__ScrapeIntervalMinutes
        value: "45"
