# Render Blueprint — NewsFeed API (ADR-004)
# Secrets (ConnectionStrings__Database, Cors origins, Admin, ingest) are set in the Render dashboard (sync: false).

services:
  - type: web
    name: newsfeed-api
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile.api
    dockerContext: .
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:8080
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: "false"
      - key: ConnectionStrings__Database
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Cors__AllowedOrigins__1
        sync: false
      - key: RateLimiting__PermitLimit
        value: "60"
      - key: RateLimiting__WindowSeconds
        value: "60"
      - key: RssIngest__Secret
        sync: false
      - key: Admin__Password
        sync: false
      - key: Admin__JwtSigningKey
        sync: false
      - key: ArticleIntelligence__ApiKey
        sync: false
      - key: ArticleIntelligence__BaseUrl
        value: "https://api.anthropic.com"
      - key: ArticleIntelligence__Model
        value: "claude-sonnet-4-5"
      - key: Upload__RootPath
        sync: false

  - type: cron
    name: newsfeed-rss-ingest
    runtime: python
    plan: starter
    schedule: "*/45 * * * *"
    buildCommand: "pip install requests"
    startCommand: "python -c \"import os,requests; r=requests.post(os.environ['INGEST_URL'].rstrip('/')+'/api/ingest/rss', headers={'X-Ingest-Key': os.environ['RssIngest__Secret']}, timeout=120); r.raise_for_status()\""
    envVars:
      - key: INGEST_URL
        sync: false
      - key: RssIngest__Secret
        sync: false
