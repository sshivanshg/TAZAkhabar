services:
  postgres:
    image: postgres:16-alpine
    container_name: tazakhabar-postgres
    environment:
      POSTGRES_DB: tazakhabar
      POSTGRES_USER: tazakhabar
      POSTGRES_PASSWORD: tazakhabar_dev_password
    ports:
      - "5432:5432"
    volumes:
      - tazakhabar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tazakhabar -d tazakhabar"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: tazakhabar-api
    env_file:
      - .env.example
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=tazakhabar;Username=tazakhabar;Password=tazakhabar_dev_password
      Cors__AllowedOrigins__0: http://localhost:8081
      Cors__AllowedOrigins__1: http://127.0.0.1:8081
      Cors__AllowedOrigins__2: http://localhost:19006
      Cors__AllowedOrigins__3: http://127.0.0.1:19006
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  reader:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend-dev
    container_name: tazakhabar-reader
    working_dir: /workspace
    command: >-
      sh -lc "pnpm install --frozen-lockfile &&
      pnpm --filter @tazakhabar/app exec expo start --web --port 19006 --host lan"
    environment:
      EXPO_PUBLIC_API_BASE_URL: http://localhost:8080
      EXPO_PUBLIC_APP_ENV: local
      EXPO_PUBLIC_SITE_URL: http://localhost:5174
      EXPO_NO_TELEMETRY: "1"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "19006:19006"
    volumes:
      - .:/workspace
      - reader_node_modules:/workspace/node_modules
      - reader_app_node_modules:/workspace/apps/app/node_modules
      - reader_shared_node_modules:/workspace/packages/shared-types/node_modules
      - reader_pnpm_store:/pnpm/store
    depends_on:
      - api
    stdin_open: true
    tty: true

  admin:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend-dev
    container_name: tazakhabar-admin
    working_dir: /workspace
    command: >-
      sh -lc "pnpm install --frozen-lockfile &&
      pnpm --filter @tazakhabar/admin exec vite --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - admin_node_modules:/workspace/node_modules
      - admin_app_node_modules:/workspace/apps/admin/node_modules
      - admin_shared_node_modules:/workspace/packages/shared-types/node_modules
      - admin_pnpm_store:/pnpm/store
    depends_on:
      - api

  site:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend-dev
    container_name: tazakhabar-site
    working_dir: /workspace
    command: >-
      sh -lc "pnpm install --frozen-lockfile &&
      pnpm --filter @tazakhabar/site exec vite --host 0.0.0.0 --port 5174"
    environment:
      VITE_READER_URL: http://localhost:19006
      VITE_SITE_URL: http://localhost:5174
      VITE_SUPPORT_EMAIL: support@tazakhabar.app
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5174:5174"
    volumes:
      - .:/workspace
      - site_node_modules:/workspace/node_modules
      - site_app_node_modules:/workspace/apps/site/node_modules
      - site_pnpm_store:/pnpm/store
    depends_on:
      - reader

  apk:
    profiles: ["build"]
    platform: linux/amd64
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.android
      target: build
      args:
        EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-https://buildy-140j.onrender.com}
        EXPO_PUBLIC_APP_ENV: ${EXPO_PUBLIC_APP_ENV:-production}
        EXPO_PUBLIC_SITE_URL: ${EXPO_PUBLIC_SITE_URL:-https://tazakhabar-site.pages.dev}
    command: >-
      sh -lc "cp
      /workspace/apps/app/android/app/build/outputs/apk/release/app-release.apk
      /output/tazakhabar-release.apk"
    volumes:
      - ./artifacts/android:/output

volumes:
  tazakhabar_pgdata:
  reader_node_modules:
  reader_app_node_modules:
  reader_shared_node_modules:
  reader_pnpm_store:
  admin_node_modules:
  admin_app_node_modules:
  admin_shared_node_modules:
  admin_pnpm_store:
  site_node_modules:
  site_app_node_modules:
  site_pnpm_store:
