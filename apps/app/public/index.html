<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#155EEF" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Khabro — clear local news for Indian cities. Pick your city and read a calm daily briefing with publisher attribution." />
    <meta name="application-name" content="Khabro" />
    <meta name="apple-mobile-web-app-title" content="Khabro" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Khabro" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://khabro.in/" />
    <meta property="og:title" content="Khabro — clear local news for your city" />
    <meta property="og:description" content="Pick your city and read fresh local news in a calm, easy-to-read format. No account required." />
    <meta property="og:image" content="https://khabro.in/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Khabro — clear local news for your city" />
    <meta name="twitter:description" content="Pick your city and read fresh local news in a calm, easy-to-read format. No account required." />
    <meta name="twitter:image" content="https://khabro.in/icon-512.png" />
    <link rel="canonical" href="https://khabro.in/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        height: 100dvh;
        width: 100%;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        margin: 0;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        min-height: 0;
        width: 100%;
        flex: 1;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      <main>
        <h1>Khabro</h1>
        <p>Clear local news for your city. JavaScript is required to open the reader.</p>
        <p><a href="https://site.khabro.in/">Visit the Khabro website</a></p>
      </main>
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
